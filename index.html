<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umer Khan - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn {
            display: block;
            padding: 15px 40px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: #764ba2;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }

        .btn-secondary:hover {
            background: #653a8a;
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.6);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 1.1em;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #764ba2;
        }

        .btn.disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn.disabled:hover {
            background: #ccc;
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .container {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Umer Khan</h1>
        <p class="subtitle">Software Developer</p>
        
        <div class="links">
            <a href="cover-letter.html" class="btn">📄 View Cover Letter</a>
            <a href="javascript:void(0)" class="btn btn-secondary disabled" id="resumeBtn" role="button" aria-disabled="true">📋 View Resume/CV (Coming Soon)</a>
        </div>

        <div class="social-links">
            <a href="https://github.com/umerkhan-12" target="_blank">GitHub</a>
            <a href="mailto:contact@umercode.me">Email</a>
        </div>
    </div>

    <script>
        // Prevent navigation for disabled button
        document.getElementById('resumeBtn').addEventListener('click', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
